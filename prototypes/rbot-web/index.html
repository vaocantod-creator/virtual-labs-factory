<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Rbot Web — Entorno Experimental (prototipo)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; height: 100%; background: #202124; color: #ddd; font: 13px system-ui, sans-serif; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    #hud { position: fixed; right: 8px; top: 8px; background: #000b; padding: 8px 10px; border-radius: 6px; min-width: 230px; }
    #hud h4 { margin: 0 0 6px; font-size: 13px; }
    #hud label { display: grid; grid-template-columns: 110px 1fr 38px; gap: 6px; align-items: center; margin: 3px 0; }
    #hud small { color: #9aa; display: block; margin-top: 6px; line-height: 1.3; }
    .etq { position: fixed; color: #000a; font-weight: 600; pointer-events: none; text-shadow: 0 0 3px #fff; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <h4>Control a Distancia</h4>
    <label>Mov. vertical <input id="mv" type="range" min="-18" max="58" step="1" value="0" /><span id="mvv">0</span></label>
    <label>Azimut <input id="az" type="range" min="-90" max="90" step="2" value="0" /><span id="azv">0</span></label>
    <label>Elevacion <input id="el" type="range" min="-50" max="50" step="2" value="0" /><span id="elv">0</span></label>
    <small>Flechas del teclado: ↑ avanzar, ↓ retroceder, → girar derecha, ← girar izquierda.<br />
    Los controles envian el mismo comando de una letra que Rbot (a..f).</small>
  </div>
  <div class="etq" id="e1">Perspectiva</div>
  <div class="etq" id="e2">Superior</div>
  <div class="etq" id="e3">Primera persona</div>
  <div class="etq" id="e4">Robot (cercana)</div>
  <script type="module" src="/src/app.ts"></script>
</body>
</html>
